env:
  TZ: UTC
  # v0.7.0 cannot read go1.27's export data ("export data version 4 is
  # greater than maximum supported version 2") and failed every build from
  # the agent's Go bump until this. v0.8.0 is what kalshi pins.
  STATICCHECK_VERSION: "v0.8.0"
  DIFFER_VERSION: "v0.0.0-20260403230520-c0574ebcacb2"

steps:
  - label: ":go: Format"
    key: "format"
    command: ".buildkite/ci/format.sh"
    timeout_in_minutes: 10
    agents:
      vm: "buildkite"
      host: "caracal"
    artifact_paths:
      - "reports/format/**/*"

  - label: ":go: Lint"
    key: "lint"
    command: ".buildkite/ci/lint.sh"
    timeout_in_minutes: 10
    agents:
      vm: "buildkite"
      host: "caracal"
    artifact_paths:
      - "reports/lint/**/*"

  - label: ":go: Test"
    key: "test"
    command: ".buildkite/ci/test.sh"
    timeout_in_minutes: 15
    agents:
      vm: "buildkite"
      host: "caracal"
    # coverage/ is deliberately NOT uploaded. Nothing downloads or renders it,
    # and `go test -coverprofile` still writes it locally, which is where
    # anyone who wants it looks. Across the organization it was 8.2 GiB, half
    # of all Buildkite hosted-artifact storage.
    artifact_paths:
      - "reports/tests/**/*"

  - label: ":go: Build"
    key: "build"
    command: ".buildkite/ci/build.sh"
    timeout_in_minutes: 10
    depends_on:
      - "format"
      - "lint"
      - "test"
    agents:
      vm: "buildkite"
      host: "caracal"
    # The compiled binary is deliberately NOT uploaded to Buildkite. This step
    # is a compile gate: the dev role installs this CLI with `go install
    # github.com/kevinburke/buildkite`, so nothing downloads dist/buildkite.
    # It cost 0.02 GiB of the 50 GB hosted-artifact limit breached 2026-09-08.
    artifact_paths:
      - "reports/build/**/*"
